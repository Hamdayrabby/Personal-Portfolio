<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#121212" />
  
  <!-- Subtle Grid Pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1f1f1f" stroke-width="1" />
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.6" />

  <!-- Accent highlight border -->
  <rect x="30" y="30" width="1140" height="570" rx="12" fill="none" stroke="#262626" stroke-width="2" />
  <path d="M 30 70 L 30 30 L 70 30" stroke="#b8e62e" stroke-width="4" fill="none" />
  <path d="M 1170 590 L 1170 570 L 1130 570" stroke="#b8e62e" stroke-width="4" fill="none" />

  <!-- Monogram Logo -->
  <rect x="90" y="90" width="64" height="64" rx="8" fill="#181818" stroke="#3a3a3a" stroke-width="2" />
  <text x="122" y="132" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="900" fill="#b8e62e" text-anchor="middle">HR</text>

  <!-- Name & Title -->
  <text x="90" y="240" font-family="'Archivo', system-ui, -apple-system, sans-serif" font-size="64" font-weight="900" fill="#ededed" letter-spacing="-0.02em">
    Hamday Rabby Hossain
  </text>
  
  <rect x="90" y="270" width="180" height="38" rx="6" fill="#1b2310" stroke="#b8e62e" stroke-width="1.5" />
  <text x="180" y="295" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#b8e62e" text-anchor="middle">
    AI ENGINEER
  </text>

  <!-- Tagline -->
  <text x="90" y="370" font-family="'Archivo', system-ui, -apple-system, sans-serif" font-size="34" font-weight="600" fill="#a3a3a3">
    Production AI Systems &amp; Agent Infrastructure
  </text>

  <!-- Three Keywords per spec §7: real-time voice, retrieval, agents -->
  <g transform="translate(90, 440)">
    <rect x="0" y="0" width="220" height="50" rx="6" fill="#181818" stroke="#3a3a3a" stroke-width="1.5" />
    <text x="110" y="31" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#ededed" text-anchor="middle">
      Real-Time Voice
    </text>

    <rect x="240" y="0" width="220" height="50" rx="6" fill="#181818" stroke="#3a3a3a" stroke-width="1.5" />
    <text x="350" y="31" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#ededed" text-anchor="middle">
      Grounded Retrieval
    </text>

    <rect x="480" y="0" width="240" height="50" rx="6" fill="#181818" stroke="#3a3a3a" stroke-width="1.5" />
    <text x="600" y="31" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#ededed" text-anchor="middle">
      Agent Infrastructure
    </text>
  </g>

  <!-- Footer URL -->
  <text x="90" y="550" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="500" fill="#737373">
    hamday-rabby.netlify.app
  </text>
</svg>
